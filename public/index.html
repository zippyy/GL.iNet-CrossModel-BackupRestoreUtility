<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GL.iNet Cross-Model Backup — Docker Edition</title>
<meta name="referrer" content="no-referrer">
<style>
:root {
  --bg: #0f172a; --panel: #1e293b; --panel2: #273449; --ink: #e2e8f0;
  --muted: #94a3b8; --accent: #38bdf8; --ok: #34d399; --warn: #fbbf24;
  --bad: #f87171; --line: #334155; --radius: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
pre { background: #0b1220; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px; overflow: auto; max-height: 320px; font-size: 12px; white-space: pre-wrap; }
button { background: var(--accent); color: #0c1526; border: 0; border-radius: 8px;
  padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px; }
button.secondary { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); }
button.danger { background: #7f1d1d; color: #fecaca; }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select, textarea { background: #0b1220; color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; width: 100%; }
label { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge.queued { background:#3b2f0a; color: var(--warn); }
.badge.running { background:#123a52; color: var(--accent); }
.badge.succeeded { background:#0a3b2a; color: var(--ok); }
.badge.failed { background:#4a1212; color: var(--bad); }
.badge.rolled-back { background:#3a2a0a; color: var(--warn); }
.badge.rollback-failed { background:#5c0a0a; color: #fecaca; }
#toast { position: fixed; bottom: 18px; right: 18px; background: #0b1220; border: 1px solid var(--line);
  padding: 10px 16px; border-radius: 8px; display: none; max-width: 480px; z-index: 50; }
#login { max-width: 380px; margin: 12vh auto; }
#app { display: none; }
nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
nav .brand { font-weight: 700; margin-right: 8px; }
nav button.navlink { background: transparent; color: var(--muted); font-weight: 500; }
nav button.navlink.active { color: var(--accent); }
main { padding: 16px; max-width: 1200px; margin: 0 auto; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.hidden { display: none !important; }
.field-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 14px; }
h2 { margin: 4px 0 12px; font-size: 18px; } h3 { margin: 2px 0 8px; font-size: 15px; }
.checkbox-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
.checkbox-row input { width: auto; }
.kv { font-size: 12px; color: var(--muted); } .kv b { color: var(--ink); }
</style>
</head>
<body>
<div id="toast"></div>

<div id="login">
  <div class="panel">
    <h2>GL.iNet Cross-Model Backup</h2>
    <p class="muted small">Docker / controller edition. Sign in with the administrator password configured on the server.</p>
    <label>Password</label>
    <input type="password" id="login-pw" autocomplete="current-password">
    <div class="row" style="margin-top:14px">
      <button id="login-btn">Sign in</button>
      <span class="small muted" id="login-status"></span>
    </div>
  </div>
</div>

<div id="app">
  <nav>
    <span class="brand">GL.iNet&nbsp;Backup</span>
    <button class="navlink active" data-view="dashboard">Dashboard</button>
    <button class="navlink" data-view="routers">Routers</button>
    <button class="navlink" data-view="profiles">Profiles</button>
    <button class="navlink" data-view="backup">Backup</button>
    <button class="navlink" data-view="restore">Restore</button>
    <button class="navlink" data-view="jobs">Jobs</button>
    <button class="navlink" data-view="diagnostics">Diagnostics</button>
    <button class="navlink" data-view="settings">Settings</button>
    <span style="flex:1"></span>
    <button class="secondary navlink" id="logout-btn">Sign out</button>
  </nav>
  <main id="view-root"></main>
</div>

<script>
'use strict';
let CSRF = null;
let appInfo = null;
let currentView = 'dashboard';
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, children = []) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) node.append(child);
  return node;
};
function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.borderColor = isError ? '#f87171' : '#334155';
  t.style.display = 'block';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.display = 'none'; }, 4200);
}
async function api(path, { method = 'GET', body } = {}) {
  const headers = { 'Accept': 'application/json' };
  if (body !== undefined) {
    headers['Content-Type'] = 'application/json';
    headers['X-CSRF-Token'] = CSRF || '';
  }
  const res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  if (res.status === 401) { window.location.reload(); throw new Error('Not authenticated'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
async function apiUpload(path, formData) {
  const headers = { 'X-CSRF-Token': CSRF || '' };
  const res = await fetch(path, { method: 'POST', headers, body: formData });
  if (res.status === 401) { window.location.reload(); throw new Error('Not authenticated'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmtTime(iso) { return iso ? new Date(iso).toLocaleString() : '—'; }
function stateBadge(state) { return `<span class="badge ${state}">${esc(state)}</span>`; }

// ---------- auth ----------
async function boot() {
  const res = await fetch('/api/session', { headers: { Accept: 'application/json' } });
  if (res.ok) {
    const data = await res.json();
    CSRF = data.csrf;
    $('#login').style.display = 'none';
    $('#app').style.display = 'block';
    appInfo = await api('/api/info').catch(() => null);
    showView(currentView);
  }
}
$('#login-btn').addEventListener('click', async () => {
  const pw = $('#login-pw').value;
  $('#login-status').textContent = 'Signing in…';
  try {
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed');
    CSRF = data.csrf;
    $('#login-status').textContent = '';
    $('#login-pw').value = '';
    boot();
  } catch (err) {
    $('#login-status').textContent = err.message;
  }
});
$('#login-pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#login-btn').click(); });
$('#logout-btn').addEventListener('click', async () => {
  try { await fetch('/api/logout', { method: 'POST', headers: { 'X-CSRF-Token': CSRF || '' } }); } catch { /* ignore */ }
  window.location.reload();
});

document.querySelectorAll('nav .navlink[data-view]').forEach((btn) => {
  btn.addEventListener('click', () => showView(btn.dataset.view));
});
function showView(view) {
  currentView = view;
  document.querySelectorAll('nav .navlink[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  const root = $('#view-root');
  root.innerHTML = '';
  if (view === 'dashboard') renderDashboard(root);
  else if (view === 'routers') renderRouters(root);
  else if (view === 'profiles') renderProfiles(root);
  else if (view === 'backup') renderBackup(root);
  else if (view === 'restore') renderRestore(root);
  else if (view === 'jobs') renderJobs(root);
  else if (view === 'diagnostics') renderDiagnostics(root);
  else if (view === 'settings') renderSettings(root);
}

// ---------- dashboard ----------
async function renderDashboard(root) {
  root.innerHTML = '<h2>Dashboard</h2>';
  try {
    const [routers, profiles, jobs, info] = await Promise.all([
      api('/api/routers'), api('/api/profiles'), api('/api/jobs'), api('/api/info').catch(() => null)
    ]);
    const panel = el('div', { class: 'grid' });
    const card = (title, value, sub) => el('div', { class: 'panel' }, [
      el('h3', { text: title }), el('div', { style: 'font-size:26px;font-weight:700', text: String(value) }),
      el('div', { class: 'muted small', text: sub || '' })
    ]);
    panel.append(
      card('Saved routers', routers.routers.length, 'managed over SSH'),
      card('Profiles', profiles.profiles.length, 'v2 archives in the library'),
      card('Recent jobs', jobs.jobs.length, 'backup / validate / restore'),
      card('Upstream runtime', info ? info.upstreamMainCommit.slice(0, 12) : '—', 'pinned canonical main commit')
    );
    root.append(panel);
    root.append(el('div', { class: 'panel' }, [
      el('h3', { text: 'Quick actions' }),
      el('div', { class: 'row' }, [
        el('button', { text: 'Add router', onclick: () => showView('routers') }),
        el('button', { text: 'Create backup', onclick: () => showView('backup') }),
        el('button', { text: 'Restore', onclick: () => showView('restore') }),
        el('button', { class: 'secondary', text: 'Diagnostics', onclick: () => showView('diagnostics') })
      ])
    ]));
    const recent = jobs.jobs.slice(0, 8);
    if (recent.length) {
      const t = el('table', {}, [el('tr', {}, [el('th', { text: 'Job' }), el('th', { text: 'Type' }), el('th', { text: 'State' }), el('th', { text: 'Created' }), el('th', { text: 'Router' })])]);
      for (const job of recent) t.append(el('tr', {}, [
        el('td', { class: 'mono', html: `<a href="#" data-job="${esc(job.id)}">${esc(job.id.slice(0, 8))}</a>` }),
        el('td', { text: job.type }), el('td', { html: stateBadge(job.state) }),
        el('td', { class: 'muted small', text: fmtTime(job.createdAt) }),
        el('td', { text: job.routerLabel || '—' })
      ]));
      root.append(el('div', { class: 'panel' }, [el('h3', { text: 'Recent jobs' }), t]));
      t.querySelectorAll('a[data-job]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); showJobDetail(a.dataset.job); }));
    }
  } catch (err) { root.append(el('p', { class: 'bad', text: err.message })); }
}

// ---------- routers ----------
let routerFormState = {};
async function renderRouters(root) {
  root.innerHTML = '<h2>Routers</h2>';
  const listPanel = el('div', { class: 'panel' });
  listPanel.append(el('h3', { text: 'Saved routers' }), el('p', { class: 'muted small', text: 'Routers are stored without passwords. Passwords are supplied per operation; host keys are verified on every connection.' }));
  const list = el('div');
  listPanel.append(list);
  root.append(listPanel);

  const formPanel = el('div', { class: 'panel' }, [el('h3', { text: 'Add router' })]);
  const f = el('div', { class: 'field-grid' });
  const fields = {
    name: { label: 'Friendly name' }, host: { label: 'Host / IP (IPv4, IPv6 or hostname)' },
    port: { label: 'SSH port', value: '22' }, username: { label: 'Username', value: 'root' }
  };
  const inputs = {};
  for (const [key, cfg] of Object.entries(fields)) {
    const wrap = el('div', {}, [el('label', { text: cfg.label })]);
    const input = el('input', { value: routerFormState[key] || cfg.value || '' });
    if (key === 'port') input.type = 'number';
    inputs[key] = input;
    wrap.append(input); f.append(wrap);
  }
  const authWrap = el('div', {}, [el('label', { text: 'Authentication' })]);
  const authSelect = el('select', {}, [
    el('option', { value: 'password', text: 'Password (supplied per job)' }),
    el('option', { value: 'key', text: 'Private key (server-side path)' }),
    el('option', { value: 'agent', text: 'SSH agent (GCM_SSH_AUTH_SOCK)' })
  ]);
  authSelect.value = routerFormState.authType || 'password';
  authWrap.append(authSelect); f.append(authWrap);

  const keyPathWrap = el('div', { class: 'hidden' }, [el('label', { text: 'Private key path on the server' })]);
  const keyPathInput = el('input', { value: routerFormState.keyPath || '' });
  keyPathWrap.append(keyPathInput); f.append(keyPathWrap);
  authSelect.addEventListener('change', () => keyPathWrap.classList.toggle('hidden', authSelect.value !== 'key'));

  const pwWrap = el('div', {}, [el('label', { text: 'Password (test connection only; never saved)' })]);
  const pwInput = el('input', { type: 'password' });
  pwWrap.append(pwInput); f.append(pwWrap);

  formPanel.append(f);
  const acceptRow = el('div', { class: 'checkbox-row' }, [
    el('input', { type: 'checkbox', id: 'accept-new' }), el('label', { text: 'Accept and store the router host key (first connection)', style: 'margin:0' })
  ]);
  formPanel.append(acceptRow);

  const resultPanel = el('div', { class: 'hidden' });
  formPanel.append(resultPanel);

  const testBtn = el('button', { class: 'secondary', text: 'Test connection' });
  const saveBtn = el('button', { text: 'Save router' });
  formPanel.append(el('div', { class: 'row', style: 'margin-top:12px' }, [testBtn, saveBtn]));

  async function loadList() {
    try {
      const data = await api('/api/routers');
      list.innerHTML = '';
      if (!data.routers.length) { list.append(el('p', { class: 'muted', text: 'No routers saved yet.' })); return; }
      const t = el('table', {}, [el('tr', {}, [el('th', { text: 'Name' }), el('th', { text: 'Host' }), el('th', { text: 'Auth' }), el('th', { text: 'Model / firmware' }), el('th', { text: 'Fingerprint' }), el('th', { text: 'Actions' })])]);
      for (const r of data.routers) {
        t.append(el('tr', {}, [
          el('td', { html: `<b>${esc(r.name)}</b><div class="muted small">${esc(r.username)}@${esc(r.host)}:${esc(r.port)}</div>` }),
          el('td', { text: `${r.host}:${r.port}` }),
          el('td', { text: r.authType }),
          el('td', { class: 'small', html: `<div>${esc(r.model || '—')}</div><div class="muted">${esc(r.firmware || '')}${r.packageManager ? ' · ' + esc(r.packageManager) : ''}</div>` }),
          el('td', { class: 'mono small', text: r.fingerprint ? r.fingerprint.slice(0, 16) + '…' : 'untrusted' }),
          el('td', { class: 'small', html: `<button class="secondary" data-act="edit" data-id="${esc(r.id)}">Edit</button> <button class="danger" data-act="del" data-id="${esc(r.id)}">Delete</button>` })
        ]));
      }
      list.append(t);
      t.querySelectorAll('button[data-act=del]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm(`Delete router ${b.closest('tr').querySelector('b').textContent}?`)) return;
        try { await api(`/api/routers/${b.dataset.id}`, { method: 'DELETE' }); toast('Router deleted'); loadList(); } catch (err) { toast(err.message, true); }
      }));
    } catch (err) { list.append(el('p', { class: 'bad', text: err.message })); }
  }
  loadList();

  function connectionBody(extra = {}) {
    const body = {
      host: inputs.host.value.trim(), port: Number(inputs.port.value || 22),
      username: inputs.username.value.trim() || 'root', authType: authSelect.value,
      acceptNewHostKey: acceptRow.querySelector('#accept-new').checked
    };
    if (authSelect.value === 'password') body.password = pwInput.value;
    return { ...body, ...extra };
  }

  testBtn.addEventListener('click', async () => {
    resultPanel.classList.remove('hidden');
    resultPanel.innerHTML = '<p class="muted">Connecting…</p>';
    testBtn.disabled = true;
    try {
      const res = await api('/api/routers/test', { method: 'POST', body: connectionBody() });
      resultPanel.innerHTML = '<p class="ok">Connection OK</p>' +
        `<table><tr><th>Model</th><td>${esc(res.facts.model || '')}</td></tr><tr><th>Firmware</th><td>${esc(res.facts.firmware || '')} (OpenWrt ${esc(res.facts.openwrt || '')})</td></tr><tr><th>Architecture</th><td>${esc(res.facts.architecture || '')}</td></tr><tr><th>Adapter</th><td>${esc(res.facts.adapter || '')}</td></tr><tr><th>Bands</th><td>${esc((res.facts.bands || []).join(', '))}</td></tr>${res.fingerprint ? `<tr><th>Fingerprint</th><td class="mono">${esc(res.fingerprint)}</td></tr>` : ''}</table>`;
    } catch (err) { resultPanel.innerHTML = `<p class="bad">${esc(err.message)}</p>`; }
    testBtn.disabled = false;
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    try {
      const res = await api('/api/routers', { method: 'POST', body: connectionBody({ name: inputs.name.value.trim(), keyPath: keyPathInput.value.trim() || undefined }) });
      toast('Router saved');
      pwInput.value = '';
      resultPanel.classList.add('hidden');
      loadList();
      routerFormState = {};
    } catch (err) { toast(err.message, true); }
    saveBtn.disabled = false;
  });
}

// ---------- profiles ----------
async function renderProfiles(root) {
  root.innerHTML = '<h2>Profiles</h2>';
  const importPanel = el('div', { class: 'panel' }, [
    el('h3', { text: 'Import profile' }),
    el('p', { class: 'muted small', text: 'Upload a canonical v2 archive (.tar.gz created by the native tool or this edition) or a legacy Docker JSON profile. Legacy JSON imports as unverified and cannot be restored.' })
  ]);
  const fileInput = el('input', { type: 'file' });
  const importBtn = el('button', { text: 'Import' });
  importPanel.append(el('div', { class: 'row' }, [fileInput, importBtn]));
  root.append(importPanel);

  const listPanel = el('div', { class: 'panel' }, [el('h3', { text: 'Library' })]);
  root.append(listPanel);

  importBtn.addEventListener('click', async () => {
    if (!fileInput.files.length) return toast('Choose a file', true);
    importBtn.disabled = true;
    try {
      const fd = new FormData();
      fd.append('profile', fileInput.files[0]);
      fd.append('label', fileInput.files[0].name.replace(/\.(tar\.gz|tgz|json)$/i, ''));
      const res = await apiUpload('/api/profiles/import', fd);
      toast(res.profile.kind === 'legacy-unverified' ? 'Imported as legacy-unverified (restore blocked)' : 'Profile imported and verified');
      loadList();
    } catch (err) { toast(err.message, true); }
    importBtn.disabled = false;
  });

  async function loadList() {
    try {
      const data = await api('/api/profiles');
      listPanel.innerHTML = '';
      listPanel.append(el('h3', { text: 'Library' }));
      if (!data.profiles.length) { listPanel.append(el('p', { class: 'muted', text: 'No profiles yet. Create a backup or import one.' })); return; }
      const t = el('table', {}, [el('tr', {}, [el('th', { text: 'Label' }), el('th', { text: 'Kind' }), el('th', { text: 'Strategy' }), el('th', { text: 'Source' }), el('th', { text: 'Size' }), el('th', { text: 'Created' }), el('th', { text: 'Actions' })])]);
      for (const p of data.profiles) {
        const kindBadge = p.kind === 'legacy-unverified' ? '<span class="badge failed">legacy-unverified</span>' : '<span class="badge succeeded">v2 verified</span>';
        t.append(el('tr', {}, [
          el('td', { html: `<b>${esc(p.label)}</b><div class="mono small muted">${esc(p.id.slice(0, 8))}…</div>` }),
          el('td', { html: kindBadge }),
          el('td', { text: p.strategy || '—' }),
          el('td', { class: 'small', text: p.source ? `${p.source.model || ''}${p.source.architecture ? ' · ' + p.source.architecture : ''}` : '—' }),
          el('td', { class: 'small', text: p.size ? `${(p.size / 1024).toFixed(0)} KB` : '—' }),
          el('td', { class: 'muted small', text: fmtTime(p.createdAt) }),
          el('td', { class: 'small', html: `<button class="secondary" data-act="inspect" data-id="${esc(p.id)}">Inspect</button> <button class="secondary" data-act="dl" data-id="${esc(p.id)}">Download</button> <button class="danger" data-act="del" data-id="${esc(p.id)}">Delete</button>` })
        ]));
      }
      listPanel.append(t);
      t.querySelectorAll('button[data-act=del]').forEach((b) => b.addEventListener('click', async () => {
        if (!confirm('Delete this profile?')) return;
        try { await api(`/api/profiles/${b.dataset.id}`, { method: 'DELETE' }); toast('Deleted'); loadList(); } catch (err) { toast(err.message, true); }
      }));
      t.querySelectorAll('button[data-act=dl]').forEach((b) => b.addEventListener('click', () => {
        window.location = `/api/profiles/${b.dataset.id}/download`;
      }));
      t.querySelectorAll('button[data-act=inspect]').forEach((b) => b.addEventListener('click', async () => {
        const btn = b; btn.disabled = true;
        try {
          const res = await api(`/api/profiles/${b.dataset.id}/inspect`);
          const panel = el('div', { class: 'panel' });
          panel.append(el('h3', { text: `Inspect ${res.label || res.profile_uuid || b.dataset.id}` }));
          panel.append(el('pre', { text: JSON.stringify(res, null, 2) }));
          listPanel.after(panel);
          panel.scrollIntoView({ behavior: 'smooth' });
        } catch (err) { toast(err.message, true); }
        btn.disabled = false;
      }));
    } catch (err) { listPanel.append(el('p', { class: 'bad', text: err.message })); }
  }
  loadList();
}

// ---------- backup ----------
async function renderBackup(root) {
  root.innerHTML = '<h2>Create backup</h2>';
  try {
    const routers = (await api('/api/routers')).routers;
    const panel = el('div', { class: 'panel' });
    if (!routers.length) {
      panel.append(el('p', { class: 'warn', text: 'Save a router first. The backup is created by the canonical native runtime on the source router and streamed back over SSH.' }));
      root.append(panel); return;
    }
    const routerSel = el('select', {}, routers.map((r) => el('option', { value: r.id, text: `${r.name} (${r.host})` })));
    const pwInput = el('input', { type: 'password', placeholder: 'SSH password (never stored)' });
    const strategySel = el('select', {}, [
      el('option', { value: 'portable', text: 'Portable Profile — cross-model migration' }),
      el('option', { value: 'clone', text: 'Clone — same model only' }),
      el('option', { value: 'remote-safe', text: 'Remote-Safe Clone — preserves management access' }),
      el('option', { value: 'snapshot', text: 'Device Snapshot — exact physical device' })
    ]);
    const labelInput = el('input', { placeholder: 'Label (optional)' });
    const notesInput = el('textarea', { rows: 2, placeholder: 'Notes (optional)' });

    const cats = ['wifi', 'lan', 'dhcp', 'dns', 'firewall', 'timezone', 'ddns', 'vpn', 'packages', 'persistent', 'custom-files', 'custom-binaries'];
    const catChecks = el('div', { class: 'grid' });
    const checked = {};
    for (const c of cats) {
      const box = el('input', { type: 'checkbox', checked: 'checked' });
      checked[c] = box;
      catChecks.append(el('label', { class: 'checkbox-row', style: 'margin:4px 0' }, [box, el('span', { text: c })]));
    }
    const scriptsInput = el('textarea', { rows: 2, placeholder: 'Custom files: one absolute path per line (optional)' });
    const binsInput = el('textarea', { rows: 2, placeholder: 'Custom ELF binaries: one absolute path per line (optional)' });

    const startBtn = el('button', { text: 'Start backup' });
    const statusDiv = el('div');
    panel.append(
      el('h3', { text: 'Source router' }),
      el('div', { class: 'field-grid' }, [
        el('div', {}, [el('label', { text: 'Router' }), routerSel]),
        el('div', {}, [el('label', { text: 'Password' }), pwInput]),
        el('div', {}, [el('label', { text: 'Strategy' }), strategySel]),
        el('div', {}, [el('label', { text: 'Label' }), labelInput])
      ]),
      el('div', {}, [el('label', { text: 'Notes' }), notesInput]),
      el('h3', { text: 'Categories' }), catChecks,
      el('div', { class: 'grid' }, [
        el('div', {}, [el('label', { text: 'Custom files / scripts' }), scriptsInput]),
        el('div', {}, [el('label', { text: 'Custom ELF binaries' }), binsInput])
      ]),
      el('div', { class: 'row', style: 'margin-top:14px' }, [startBtn, statusDiv])
    );
    root.append(panel);

    const list = (text) => text.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      statusDiv.innerHTML = '<p class="muted">Submitting backup job…</p>';
      try {
        const body = {
          type: 'backup', routerId: routerSel.value,
          password: pwInput.value || undefined,
          strategy: strategySel.value,
          label: labelInput.value.trim() || undefined,
          notes: notesInput.value.trim() || undefined,
          categories: cats.filter((c) => checked[c].checked).join(','),
          scripts: list(scriptsInput.value),
          binaries: list(binsInput.value)
        };
        const res = await api('/api/jobs', { method: 'POST', body });
        pwInput.value = '';
        statusDiv.innerHTML = `Job started: <span class="mono">${res.job.id.slice(0, 8)}…</span> <a href="#" data-job="${esc(res.job.id)}">follow</a>`;
        statusDiv.querySelector('a').addEventListener('click', (e) => { e.preventDefault(); showJobDetail(res.job.id); });
      } catch (err) { statusDiv.innerHTML = `<p class="bad">${esc(err.message)}</p>`; }
      startBtn.disabled = false;
    });
  } catch (err) { root.append(el('p', { class: 'bad', text: err.message })); }
}

// ---------- restore ----------
async function renderRestore(root) {
  root.innerHTML = '<h2>Restore</h2>';
  const panel = el('div', { class: 'panel' });
  panel.append(el('p', { class: 'muted small', text: 'Restore is never a single click: choose profile + router, run validation, review the canonical plan, then confirm with the one-use plan token.' }));
  root.append(panel);
  try {
    const [routers, profiles] = await Promise.all([api('/api/routers'), api('/api/profiles')]);
    const v2 = profiles.profiles.filter((p) => p.kind !== 'legacy-unverified');
    const routerSel = el('select', {}, routers.routers.map((r) => el('option', { value: r.id, text: `${r.name} (${r.host})` })));
    const profileSel = el('select', {}, v2.map((p) => el('option', { value: p.id, text: `${p.label} — ${p.strategy} (${p.id.slice(0, 8)})` })));
    const pwInput = el('input', { type: 'password', placeholder: 'SSH password (never stored)' });
    const cats = ['wifi', 'lan', 'dhcp', 'dns', 'firewall', 'timezone', 'ddns', 'vpn', 'packages', 'persistent', 'custom-files', 'custom-binaries'];
    const catChecks = el('div', { class: 'grid' });
    const checked = {};
    for (const c of cats) { const box = el('input', { type: 'checkbox', checked: 'checked' }); checked[c] = box; catChecks.append(el('label', { class: 'checkbox-row', style: 'margin:4px 0' }, [box, el('span', { text: c })])); }
    const preserveRow = el('div', { class: 'checkbox-row' }, [el('input', { type: 'checkbox', id: 'preserve-ip' }), el('label', { text: 'Preserve destination LAN IP', style: 'margin:0' })]);
    const overrideRow = el('div', { class: 'checkbox-row' }, [el('input', { type: 'checkbox', id: 'danger-override' }), el('label', { text: 'Dangerous device override (snapshot to a different physical device — explicit only)', style: 'margin:0' })]);
    const directRow = el('div', { class: 'checkbox-row' }, [el('input', { type: 'checkbox', id: 'direct-files' }), el('label', { text: 'Direct custom-file restore (overwrite target paths)', style: 'margin:0' })]);

    const validateBtn = el('button', { text: '1 · Validate against target' });
    const statusDiv = el('div');
    let planState = null;

    panel.append(
      el('div', { class: 'field-grid' }, [
        el('div', {}, [el('label', { text: 'Profile' }), profileSel]),
        el('div', {}, [el('label', { text: 'Target router' }), routerSel]),
        el('div', {}, [el('label', { text: 'Password' }), pwInput])
      ]),
      el('h3', { text: 'Categories' }), catChecks,
      preserveRow, overrideRow, directRow,
      el('div', { class: 'row', style: 'margin-top:14px' }, [validateBtn, statusDiv])
    );

    validateBtn.addEventListener('click', async () => {
      validateBtn.disabled = true;
      statusDiv.innerHTML = '<p class="muted">Validation runs the canonical engine against the live target (checksums, compatibility, plan). This may take a moment…</p>';
      planState = null;
      try {
        const res = await api('/api/jobs', {
          method: 'POST', body: {
            type: 'validate', routerId: routerSel.value, profileId: profileSel.value,
            password: pwInput.value || undefined,
            categories: cats.filter((c) => checked[c].checked).join(','),
            preserveLanIp: preserveRow.querySelector('#preserve-ip').checked,
            dangerousOverride: overrideRow.querySelector('#danger-override').checked
          }
        });
        // Wait for the job to finish, then fetch the plan from the job result.
        statusDiv.innerHTML = `<p class="muted">Validation job <span class="mono">${res.job.id.slice(0, 8)}…</span> running…</p>`;
        const done = await pollJob(res.job.id, statusDiv);
        if (done.state !== 'succeeded') throw new Error(done.error || `Validation ${done.state}`);
        const job = await api(`/api/jobs/${res.job.id}`);
        const plan = job.result.plan;
        planState = { plan, planToken: job.result.planToken, targetFactsHash: job.result.targetFactsHash, jobId: res.job.id };
        const compatible = plan.compatible === true;
        const panel = el('div', { class: 'panel' });
        panel.append(el('h3', { text: `Validation plan — ${compatible ? 'compatible' : 'INCOMPATIBLE'}` }));
        const rows = [];
        const kv = (k, v) => rows.push(el('tr', {}, [el('th', { text: k }), el('td', { html: v })]));
        kv('Strategy', esc(plan.backup_strategy));
        kv('Compatible', compatible ? '<span class="ok">yes</span>' : '<span class="bad">no</span>');
        kv('Source', esc(`${plan.source?.model || ''} · ${plan.source?.firmware || ''} · ${plan.source?.architecture || ''}`));
        kv('Target', esc(`${plan.target?.model || ''} · ${plan.target?.firmware || ''} · ${plan.target?.architecture || ''}`));
        const block = (label, list) => { if (list?.length) { kv(label, esc(list.length)); for (const item of list) rows.push(el('tr', {}, [el('td'), el('td', { class: 'muted small', text: item })])); } };
        block('Incompatible', plan.incompatible);
        block('Will apply', plan.will_apply);
        block('Will adapt', plan.will_adapt);
        block('Will preserve', plan.will_preserve);
        block('Will skip', plan.will_skip);
        block('Deferred', plan.will_defer);
        block('Warnings', plan.warnings);
        block('Dangerous', plan.dangerous_actions);
        panel.append(el('table', {}, rows));
        statusDiv.replaceChildren(panel);
        if (compatible) {
          const confirmRow = el('div', { class: 'row', style: 'margin-top:10px' }, [
            el('button', { class: 'danger', text: '2 · Confirm and restore' }),
            el('span', { class: 'muted small', text: 'Creates a target-side pre-restore snapshot first; automatic verified rollback on failure.' })
          ]);
          panel.append(confirmRow);
          confirmRow.querySelector('button').addEventListener('click', async () => {
            if (!confirm('Restore will modify the target router. The plan token is single-use. Continue?')) return;
            const btn = confirmRow.querySelector('button'); btn.disabled = true; btn.textContent = 'Restoring…';
            try {
              const r = await api('/api/jobs', {
                method: 'POST', body: {
                  type: 'restore', routerId: routerSel.value, profileId: profileSel.value,
                  password: pwInput.value || undefined,
                  planToken: planState.planToken,
                  targetFactsHash: planState.targetFactsHash,
                  strategy: plan.backup_strategy,
                  categories: cats.filter((c) => checked[c].checked).join(','),
                  preserveLanIp: preserveRow.querySelector('#preserve-ip').checked,
                  dangerousOverride: overrideRow.querySelector('#danger-override').checked,
                  directCustomFiles: directRow.querySelector('#direct-files').checked,
                  packages: ''
                }
              });
              pwInput.value = '';
              const restoreStatus = el('div');
              confirmRow.replaceWith(restoreStatus);
              restoreStatus.innerHTML = `<p class="muted">Restore job <span class="mono">${r.job.id.slice(0, 8)}…</span> running — snapshot, apply, deferred activation…</p>`;
              const outcome = await pollJob(r.job.id, restoreStatus);
              if (outcome.state === 'rolled-back') { restoreStatus.innerHTML = '<p class="warn">Restore failed; the target was automatically rolled back to its pre-restore state.</p>'; }
              else if (outcome.state === 'rollback-failed') { restoreStatus.innerHTML = '<p class="bad">CRITICAL: restore and rollback both failed. Inspect the snapshot on the target immediately.</p>'; }
              else if (outcome.state === 'succeeded') {
                const markers = outcome.result?.markers || {};
                const html = ['<p class="ok">Restore succeeded. Connectivity reload was deferred (DEFERRED items present).</p>'];
                const deferred = markers.deferred || [];
                if (deferred.length) {
                  html.push('<p>Deferred items — run activation when ready:</p><pre>' + esc(deferred.join('\n')) + '</pre>');
                  html.push('<button id="activate-btn" class="secondary">Run activation</button>');
                }
                restoreStatus.innerHTML = html.join('');
                const act = restoreStatus.querySelector('#activate-btn');
                if (act) act.addEventListener('click', async () => {
                  if (!confirm('Activation applies staged network/firewall/wireless changes and may drop the connection. Continue?')) return;
                  try {
                    const ar = await api('/api/jobs', { method: 'POST', body: { type: 'activate', routerId: routerSel.value, password: pwInput.value || undefined } });
                    restoreStatus.innerHTML = `<p class="muted">Activation job <span class="mono">${ar.job.id.slice(0, 8)}…</span></p>`;
                    await pollJob(ar.job.id, restoreStatus);
                    toast('Activation complete — a service reload or reboot may still be required');
                  } catch (err) { toast(err.message, true); }
                });
              } else {
                restoreStatus.innerHTML = `<p class="bad">Restore ${esc(outcome.state)}: ${esc(outcome.error || '')}</p>`;
              }
            } catch (err) { toast(err.message, true); btn.disabled = false; btn.textContent = '2 · Confirm and restore'; }
          });
        }
      } catch (err) { statusDiv.innerHTML = `<p class="bad">${esc(err.message)}</p>`; }
      validateBtn.disabled = false;
    });
  } catch (err) { root.append(el('p', { class: 'bad', text: err.message })); }
}

async function pollJob(jobId, statusEl) {
  // Poll /api/jobs/:id until the job leaves running/queued (max ~10 min).
  const deadline = Date.now() + 10 * 60 * 1000;
  for (;;) {
    const data = await api(`/api/jobs/${jobId}`);
    const job = data.job;
    if (!['queued', 'running'].includes(job.state)) return job;
    const progress = job.progress?.length ? job.progress[job.progress.length - 1] : null;
    if (progress?.line && statusEl) {
      statusEl.innerHTML = `<p class="muted mono small">${esc(progress.line.slice(0, 200))}</p>`;
    }
    if (Date.now() > deadline) throw new Error('Job timed out while polling; check the Jobs view.');
    await new Promise((r) => setTimeout(r, 1200));
  }
}

// ---------- jobs ----------
async function renderJobs(root) {
  root.innerHTML = '<h2>Jobs</h2>';
  const listPanel = el('div', { class: 'panel' });
  root.append(listPanel);
  let timer = null;
  async function load() {
    try {
      const data = await api('/api/jobs');
      listPanel.innerHTML = '';
      listPanel.append(el('h3', { text: 'All jobs' }));
      if (!data.jobs.length) { listPanel.append(el('p', { class: 'muted', text: 'No jobs yet.' })); return; }
      const t = el('table', {}, [el('tr', {}, [el('th', { text: 'ID' }), el('th', { text: 'Type' }), el('th', { text: 'State' }), el('th', { text: 'Router' }), el('th', { text: 'Profile' }), el('th', { text: 'Created' }), el('th', { text: 'Finished' })])]);
      for (const job of data.jobs) {
        t.append(el('tr', {}, [
          el('td', { class: 'mono small', html: `<a href="#" data-job="${esc(job.id)}">${esc(job.id.slice(0, 12))}</a>` }),
          el('td', { text: job.type }),
          el('td', { html: stateBadge(job.state) }),
          el('td', { class: 'small', text: job.routerLabel || '—' }),
          el('td', { class: 'mono small', text: job.profileId ? job.profileId.slice(0, 8) : '—' }),
          el('td', { class: 'muted small', text: fmtTime(job.createdAt) }),
          el('td', { class: 'muted small', text: fmtTime(job.finishedAt) })
        ]));
      }
      listPanel.append(t);
      t.querySelectorAll('a[data-job]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); showJobDetail(a.dataset.job); }));
    } catch (err) { listPanel.append(el('p', { class: 'bad', text: err.message })); }
  }
  await load();
  timer = setInterval(load, 5000);
  // stop polling when the view changes
  const stop = () => clearInterval(timer);
  window._viewCleanup?.();
  window._viewCleanup = stop;
}

async function showJobDetail(id) {
  showView('jobs');
  const root = $('#view-root');
  const panel = el('div', { class: 'panel' });
  panel.append(el('h3', { text: `Job ${id.slice(0, 12)}…` }));
  panel.append(el('p', { class: 'muted small', text: 'Refreshing…' }));
  root.prepend(panel);
  const render = async () => {
    try {
      const data = await api(`/api/jobs/${id}`);
      const job = data.job;
      panel.innerHTML = '';
      panel.append(el('h3', { text: `Job ${job.id.slice(0, 12)}… `, html: undefined }));
      const h = el('h3');
      h.append(document.createTextNode(`Job ${job.id.slice(0, 12)}… `));
      h.append(el('span', { class: 'badge ' + job.state, text: job.state }));
      panel.replaceChildren(h);
      const rows = [['Type', job.type], ['Correlation ID', job.correlationId || '—'], ['Router', job.routerLabel || '—'], ['State', job.state], ['Created', fmtTime(job.createdAt)], ['Finished', fmtTime(job.finishedAt)]];
      if (job.error) rows.push(['Error', `<span class="bad">${esc(job.error)}</span>`]);
      panel.append(el('table', {}, rows.map(([k, v]) => el('tr', {}, [el('th', { text: k }), el('td', { html: v })]))));
      const progress = job.progress || [];
      if (progress.length) panel.append(el('pre', { text: progress.map((p) => `${p.at} ${p.line || p.message || ''}`).join('\n') }));
      if (job.result && Object.keys(job.result).length) {
        const serializable = { ...job.result };
        if (serializable.planToken) delete serializable.planToken;
        panel.append(el('pre', { text: JSON.stringify(serializable, null, 2) }));
      }
      panel.append(el('div', { class: 'row', style: 'margin-top:8px' }, [el('button', { class: 'secondary', text: 'Refresh', onclick: render })]));
    } catch (err) { panel.innerHTML = `<p class="bad">${esc(err.message)}</p>`; }
  };
  render();
}

// ---------- diagnostics ----------
async function renderDiagnostics(root) {
  root.innerHTML = '<h2>Diagnostics</h2>';
  const levelPanel = el('div', { class: 'panel' });
  root.append(levelPanel);
  const logPanel = el('div', { class: 'panel' });
  root.append(logPanel);
  const info = await api('/api/info').catch(() => null);
  levelPanel.append(el('h3', { text: 'Log level' }));
  const sel = el('select', {}, ['INFO', 'DEBUG', 'TRACE'].map((l) => el('option', { value: l, text: l })));
  const setBtn = el('button', { class: 'secondary', text: 'Set level' });
  levelPanel.append(el('div', { class: 'row' }, [sel, setBtn]));
  setBtn.addEventListener('click', async () => {
    try { const r = await api('/api/settings/log-level', { method: 'POST', body: { level: sel.value } }); toast(`Log level ${r.level}`); } catch (err) { toast(err.message, true); }
  });
  const dlBtn = el('button', { class: 'secondary', text: 'Download log' });
  const clearBtn = el('button', { class: 'danger', text: 'Clear log' });
  levelPanel.append(el('div', { class: 'row', style: 'margin-top:10px' }, [dlBtn, clearBtn]));
  dlBtn.addEventListener('click', () => { window.location = '/api/logs/download'; });
  clearBtn.addEventListener('click', async () => {
    if (!confirm('Clear the diagnostic log?')) return;
    try { await api('/api/logs/clear', { method: 'POST' }); toast('Log cleared'); loadLogs(); } catch (err) { toast(err.message, true); }
  });

  logPanel.append(el('h3', { text: 'Recent log entries' }));
  const pre = el('pre');
  logPanel.append(pre);
  async function loadLogs() {
    try {
      const r = await api('/api/logs?limit=300');
      sel.value = r.level;
      pre.textContent = r.logs.map((e) => e.line || JSON.stringify(e)).join('\n') || '(empty)';
    } catch (err) { pre.textContent = err.message; }
  }
  await loadLogs();
  if (info) logPanel.append(el('p', { class: 'muted small', text: `Upstream runtime: ${info.upstreamMainCommit}` }));
  const timer = setInterval(loadLogs, 5000);
  window._viewCleanup?.();
  window._viewCleanup = () => clearInterval(timer);
}

// ---------- settings ----------
async function renderSettings(root) {
  root.innerHTML = '<h2>Settings</h2>';
  const panel = el('div', { class: 'panel' });
  root.append(panel);
  try {
    const res = await api('/api/settings');
    const s = res.settings;
    const inputs = {};
    const mk = (key, label, value) => {
      const wrap = el('div', {}, [el('label', { text: label })]);
      const input = el('input', { type: 'number', value: String(value) });
      inputs[key] = input; wrap.append(input); return wrap;
    };
    panel.append(el('h3', { text: 'Storage policy' }));
    const grid = el('div', { class: 'field-grid' });
    grid.append(mk('maxProfiles', 'Maximum profiles', s.maxProfiles));
    grid.append(mk('maxTotalBytes', 'Maximum total bytes', s.maxTotalBytes));
    grid.append(mk('rollbackRetention', 'Rollback retention', s.rollbackRetention));
    panel.append(grid);
    const save = el('button', { text: 'Save settings' });
    panel.append(el('div', { class: 'row', style: 'margin-top:12px' }, [save]));
    save.addEventListener('click', async () => {
      try {
        await api('/api/settings', {
          method: 'PUT', body: { settings: {
            maxProfiles: Number(inputs.maxProfiles.value),
            maxTotalBytes: Number(inputs.maxTotalBytes.value),
            rollbackRetention: Number(inputs.rollbackRetention.value)
          } }
        });
        toast('Settings saved');
      } catch (err) { toast(err.message, true); }
    });
  } catch (err) { panel.append(el('p', { class: 'bad', text: err.message })); }
}

boot();
</script>
