name: docker-edition-ci

# Docker-edition CI. Operates ONLY on the `docker` branch and never touches
# the native IPK/APK main-branch release semantics (no native tags, no GitHub
# Releases). PRs build and test but NEVER publish.

on:
  push:
    branches:
      - docker
  pull_request:
    branches:
      - docker
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build + test + lint + container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # runtime-drift guard compares against the pin commit

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Aggregate test suite (native shell suites + Node tests + drift guard)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Whitespace check
        run: git diff --check

      - name: Build image
        run: docker build -t glinet-crossmodel-docker:ci .

      - name: Container smoke (non-root, /data, auth fail-closed, CSRF, UI, restart persistence)
        run: test/container-smoke.sh glinet-crossmodel-docker:ci

  publish:
    name: Publish multi-arch image to GHCR
    # Only a push to the docker branch publishes; pull requests never do.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (docker-branch tags only)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/zippyy/glinet-crossmodel-backuprestoreutility
          tags: |
            type=raw,value=docker
            type=raw,value=docker-latest
            type=sha,prefix=sha-,format=short

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
